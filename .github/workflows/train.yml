name: pulso-transmi-train

on:
  workflow_dispatch:
  # Actualización horaria. El disparo principal lo hace drift.yml (cada hora
  # vía cron-job.org, regla "actualización horaria" de src/drift.py); este
  # schedule es respaldo por si GitHub lo llega a ejecutar.
  schedule:
    - cron: "20 * * * *"

# Un solo entrenamiento a la vez; uno que llegue mientras otro corre espera.
concurrency:
  group: pulso-transmi-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # CV + duelo entrenan 4 veces el ensamble (GBM + modelo por nivel)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: pytest -q

      - name: Entrenar candidato y registrar métricas
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          # Sin esta key, fetch_all_observations() no puede leer
          # /v1/stream/observations y el modelo se entrenaría solo con el
          # histórico estático, ignorando todos los datos de la competencia.
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.train

      - uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 30
