name: pulso-transmi-infer

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (recomendación oficial; ventana real dura 25 min)

concurrency:
  group: pulso-transmi-infer
  cancel-in-progress: false

jobs:
  infer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # El bundle del champion pesa ~5 MB y esta acción corre cada 10 min.
      # Sin caché serían ~20 GB/mes de egreso desde Supabase Storage, muy por
      # encima del plan gratuito. Con caché solo se descarga cuando cambia la
      # versión promovida.
      - name: Restaurar modelo cacheado
        uses: actions/cache/restore@v4
        with:
          path: artifacts
          key: modelo-
          restore-keys: modelo-

      - name: Generar 48 predicciones (12 estaciones x 4 horizontes) y evaluarlas
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.infer

      # Se queda solo con el modelo más reciente (el champion recién
      # descargado). Antes se tomaba el primero en orden alfabético, que era el
      # viejo restaurado de la caché: la caché quedó atascada en
      # v20260924T055040Z y cada corrida volvía a descargar el champion.
      - name: Identificar la versión en disco
        id: modelo
        run: |
          reciente=$(ls -t artifacts/*.joblib 2>/dev/null | head -1)
          if [ -n "$reciente" ]; then
            find artifacts -name '*.joblib' ! -path "$reciente" -delete
            echo "version=$(basename "$reciente")" >> "$GITHUB_OUTPUT"
          fi

      - name: Guardar modelo en caché
        if: steps.modelo.outputs.version != ''
        uses: actions/cache/save@v4
        with:
          path: artifacts
          key: modelo-${{ steps.modelo.outputs.version }}
