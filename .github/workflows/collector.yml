name: pulso-transmi-collector

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (recomendación oficial; ventana real dura 25 min)

concurrency:
  group: pulso-transmi-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Sincronizar histórico/incremental a Supabase (idempotente)
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.ingest

      # Los datos que acaban de llegar resuelven targets que predijimos antes.
      # Sin este paso las predicciones reales nunca se evaluaban y el drift
      # solo veía lotes simulados sobre historia ya conocida.
      - name: Evaluar predicciones reales ya resueltas
        env:
          PULSO_API_URL: ${{ vars.PULSO_API_URL }}
          PULSO_API_KEY: ${{ secrets.PULSO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -m src.evaluate
